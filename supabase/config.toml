# Local CLI label; `supabase link --project-ref <your-project-ref>` replaces it for your project.
project_id = "mojtama-al-saytara"

# The cleanup endpoint is called by a database webhook and authenticates with its own
# high-entropy CLEANUP_WEBHOOK_SECRET header. Do not expose it to browsers.
[functions.cleanup-verification-files]
verify_jwt = false

# The account deletion endpoint must receive a valid signed-in user's JWT.
[functions.delete-account]
verify_jwt = true

# Learning endpoints authenticate approved users with their Supabase JWT.
[functions.learning-room]
verify_jwt = true

[functions.learning-token]
verify_jwt = true

[functions.learning-playback]
verify_jwt = true

# Owner-only readiness check; values are never returned to the browser.
[functions.learning-health]
verify_jwt = true

# 100ms webhooks use a high-entropy custom header rather than a Supabase user JWT.
[functions.learning-webhook]
verify_jwt = false
