name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Clear stale in-progress Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stale_version='a97bb81618c44a87a5a8ef7d484c8870b0e8ce01'
          response_file="$(mktemp)"
          http_status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/deployments/$stale_version/cancel")"
          if [ "$http_status" = '204' ] || [ "$http_status" = '404' ]; then
            echo "Stale Pages deployment cleanup returned HTTP $http_status."
          else
            cat "$response_file"
            echo "Unable to clear the stale Pages deployment (HTTP $http_status)."
            exit 1
          fi
          rm -f "$response_file"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint source
        run: npm run lint
      - name: Type check source
        run: npm run typecheck
      - name: Validate editorial content
        run: npm run test:content
      - name: Validate SEO fixtures
        run: npm run test:seo-fixtures
      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://proexcellencenetwork-art.github.io/mojtama-al-saytara/' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          # Set true only after CAPTCHA is enabled in Supabase Auth and verified with a test signup.
          VITE_SUPABASE_CAPTCHA_ENFORCED: ${{ vars.VITE_SUPABASE_CAPTCHA_ENFORCED }}
          # Public registration is enabled; email confirmation remains required by Auth.
          VITE_PUBLIC_SIGNUP_ENABLED: 'true'
      - name: Stage root files for branch-based Pages
        run: npm run stage:pages
      - name: Commit generated branch-based Pages files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/commit-pages-output.mjs
          if git diff --cached --quiet; then
            echo 'The root Pages output is already up to date.'
          else
            git commit -m 'chore: update GitHub Pages static output'
            git push origin HEAD:main
          fi
      # GitHub Pages is published by the repository's branch-based Pages workflow
      # after the generated root files are committed above. Do not start a second
      # deploy-pages action here; it races the branch deployment and cancels it.
