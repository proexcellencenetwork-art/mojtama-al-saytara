name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint source
        run: npm run lint
      - name: Type check source
        run: npm run typecheck
      - name: Validate editorial content
        run: npm run test:content
      - name: Validate SEO fixtures
        run: npm run test:seo-fixtures
      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://proexcellencenetwork-art.github.io/mojtama-al-saytara/' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          # Keep public signup closed until authenticated UAT, email, RLS, and CAPTCHA gates pass.
          VITE_PUBLIC_SIGNUP_ENABLED: 'false'
      - name: Stage root files for branch-based Pages
        run: npm run stage:pages
      - name: Commit generated branch-based Pages files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/commit-pages-output.mjs
          if git diff --cached --quiet; then
            echo 'The root Pages output is already up to date.'
          else
            git commit -m 'chore: update GitHub Pages static output'
            git push origin HEAD:main
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
