name: Pull Request Validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'docs/**'
      - '*.md'
      - 'supabase/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, content checks, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Validate editorial content
        run: npm run test:content

      - name: Validate SEO fixtures
        run: npm run test:seo-fixtures

      - name: Production build and generated SEO validation
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_SITE_URL: 'https://proexcellencenetwork-art.github.io/mojtama-al-saytara/'
          VITE_PUBLIC_SIGNUP_ENABLED: 'false'
